# One container is one model and one job at a time. For more throughput run
# replicas on a port range, e.g. ASR_REPLICAS=6 ASR_PORTS=8001-8006, and
# spread requests across the ports. Download the model once before scaling
# (docker compose run --rm asr python -c "from src.services.transcriber import WhisperTranscriber as W; W()")
# so replicas do not fetch it at the same time.
services:
  asr:
    build: .
    ports:
      - "${ASR_PORTS:-8000}:8000"
    volumes:
      - ./models:/app/models
    env_file:
      - path: .env
        required: false
    environment:
      OMP_NUM_THREADS: ${WHISPER_CPU_THREADS:-4}
    deploy:
      replicas: ${ASR_REPLICAS:-1}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
